spring:
  application:
    name: forgeshift-wso2-migration-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:config/application-${SPRING_PROFILES_ACTIVE:local}.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      # MUST be the SAME database discovery + assessment write to: the migration service uses one
      # MongoTemplate both for its own migration_jobs AND to READ discovery's discovery_wso2_*
      # snapshots (DiscoverySnapshotReader). A different db here => findLatestRevision returns 0 =>
      # every migration translates 0. Default aligned with the discovery/assessment shared db.
      # NOTE: when MONGODB_URI is set, its database path wins over the `database` property (Spring
      # Data), so the URI's path must also be probestack-wso2-forgeshift.
      uri: ${MONGODB_WSO2_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-wso2-forgeshift?appName=probestack-prod}
      database: ${MONGODB_WSO2_DATABASE:probestack-wso2-forgeshift}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /wso2/migration/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.forgeshift: INFO
    org.springframework.web: INFO
    org.mongodb.driver: WARN

anthropic:
  api-key: ${ANTHROPIC_API_KEY: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}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
  temperature: ${ANTHROPIC_TEMPERATURE:0.0}
  connect-timeout-ms: ${ANTHROPIC_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${ANTHROPIC_READ_TIMEOUT_MS:60000}
  min-confidence: ${ANTHROPIC_MIN_CONFIDENCE:0.7}
  max-lua-bytes: ${ANTHROPIC_MAX_LUA_BYTES:51200}

gcs:
  # Reads the assessment-staged API JSON as a 3rd reconcile source (lowest precedence).
  # Mirrors the assessment service's gcs block; SA key mounted into credentials/ at runtime.
  enabled: ${GCS_ENABLED:true}
  credentials:
    location: ${GCS_CREDENTIALS_LOCATION:file:credentials/firestore-credentials.json}
  project-id: ${GCS_PROJECT_ID:your-project-id}
  default-bucket-name: ${GCS_DEFAULT_BUCKET_NAME:run-sources-probestack-e2068-us-central1}
  migration-bucket-name: ${GCS_MIGRATION_BUCKET_NAME:run-sources-probestack-e2068-us-central1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

forgeshift:
  migration:
    # Collections written by THIS service
    jobs-collection: migration_jobs
    entity-mappings-collection: entity_mappings
    reports-collection: migration_reports
    audit-collection: migration_audit_info

    # Collections READ from discovery service
    discovery-collection-prefix: discovery_wso2_
    discovery-revisions-collection: discovery_revisions

    # Collections READ from profile-config service
    wso2-profiles-collection: wso2_profiles
    kong-konnect-profiles-collection: kong_konnect_profiles
    git-profiles-collection: git_profiles

    # Translation defaults
    translation:
      default-throttle-rpm: ${TRANSLATION_DEFAULT_THROTTLE_RPM:10000}
      default-timeout-ms: ${TRANSLATION_DEFAULT_TIMEOUT_MS:60000}
      tag-prefix: wso2-source-id
      migrated-by-tag: migrated-by:forgeshift-wso2-migrator
      # Throttling tier name → requests per minute. FALLBACK ONLY — real per-minute limits now come from the discovered WSO2 throttling policies (ThrottlingTierResolver); this map is used only when that discovery data is unavailable.
      throttling-tier-map:
        Bronze: 10
        Silver: 50
        Gold: 200
        Platinum: 500
        Unlimited: 10000

    # Konnect API tuning
    konnect:
      base-url-fallback: ${KONNECT_BASE_URL:https://us.api.konghq.com}
      access-token-fallback: ${KONNECT_ACCESS_TOKEN:}
      control-plane-id-fallback: ${KONNECT_CONTROL_PLANE_ID:}
      request-timeout-seconds: 30
      trust-self-signed: ${KONNECT_TRUST_SELF_SIGNED:false}
      # Path templates under {base-url}/v2/control-planes/{cp-id}/core-entities/...
      services-path: /services
      routes-path: /routes
      upstreams-path: /upstreams
      targets-path: /upstreams/{upstreamId}/targets
      consumers-path: /consumers
      plugins-path: /plugins

    tenant:
      header-name: ${TENANT_HEADER:X-Partner-Id}
      default-tenant: ${DEFAULT_TENANT:probestack}

    # WSO2 source-side tuning for the bundle download phase. The actual
    # baseUrl / admin creds / DCR client are resolved per request from
    # the wso2_profiles collection.
    wso2:
      publisher-scope: ${WSO2_PUBLISHER_SCOPE:apim:api_view apim:api_create apim:api_publish apim:api_import_export apim:common_operation_policy_view}
      token-path: ${WSO2_TOKEN_PATH:/oauth2/token}
      # APIM 4.x export endpoint — query-string form. The client appends
      # ?apiId=...&format=...&preserveStatus=... at call time.
      export-path: ${WSO2_EXPORT_PATH:/api/am/publisher/v4/apis/export}
      export-format: ${WSO2_EXPORT_FORMAT:JSON}
      preserve-status: ${WSO2_PRESERVE_STATUS:true}
      timeout-seconds: ${WSO2_TIMEOUT_SECONDS:60}

    bundle-download:
      temp-dir: ${BUNDLE_TEMP_DIR:${java.io.tmpdir}/wso2-migration-bundles}
      cleanup-after-migration: ${BUNDLE_CLEANUP:true}

    # Dependency-aware migration. When a request sets includeDependencies=true, the migrator
    # pulls each selected resource's dependencies from the assessment graph and skips anything
    # already present in Kong. The graph is read by assessmentTransactionId when provided, else
    # by the migration's own requestTransactionId (both match the assessment doc's
    # requestTransactionId field, so one shared id across the flow works).
    dependency:
      enabled: ${DEPENDENCY_ENABLED:true}
      assessment-resource-info-collection: ${ASSESSMENT_RESOURCE_INFO_COLLECTION:wso2_assessment_resource_info}
      exclude-already-migrated: ${DEPENDENCY_EXCLUDE_ALREADY_MIGRATED:true}

    # Recreate Kong consumer credentials from WSO2 application OAuth2 keys so migrated APIs are callable.
    # live-key-fetch pulls each migrated app's PUBLIC consumer key from the DevPortal + the Key Manager's
    # RSA public key (/oauth2/jwks) at migration time, so a Kong consumer gets a working jwt/key-auth
    # credential even when the assessment never captured the keys. The OAuth2 client SECRET is never read.
    credentials:
      enabled: ${CREDENTIALS_ENABLED:true}
      live-key-fetch: ${CREDENTIALS_LIVE_KEY_FETCH:true}
      dev-portal-scope: ${CREDENTIALS_DEVPORTAL_SCOPE:apim:subscribe apim:app_manage}

    # Custom Kong (Lua) plugin generation + upload for WSO2 policies with no built-in Kong
    # equivalent — e.g. the JS fraud-risk-scoring op-policy → the forgeshift-risk-scoring Lua
    # plugin. OFF by default: when off the migration is byte-for-byte the serverless-inline
    # behaviour and such policies degrade to a "manual review" warning. Turning this on activates
    # CUSTOM_PLUGIN mode, which is gated further by a LIVE probe that the target Konnect control
    # plane is Dedicated Cloud (require-dedicated-control-plane) so a serverless CP is never sent a
    # custom plugin. NO AI is used — deterministic translators handle the known custom policies.
    # Flip on staging with env CUSTOM_PLUGINS_ENABLED=true (or the relaxed-binding env var
    # FORGESHIFT_MIGRATION_CUSTOMPLUGINS_ENABLED=true on the current image) + restart.
    custom-plugins:
      enabled: ${CUSTOM_PLUGINS_ENABLED:true}
      require-dedicated-control-plane: ${CUSTOM_PLUGINS_REQUIRE_DEDICATED_CP:true}
      path: ${CUSTOM_PLUGINS_PATH:/custom-plugins}

    # decK bundle delivery — when enabled, migrations produce a kong.yaml bundle
    # (committed to git → pipeline runs `deck gateway apply`) instead of calling
    # the Konnect REST API directly.
    deck:
      enabled: ${DECK_ENABLED:true}
      format-version: "3.0"
      transform: true
      # Route mapping: PREFIX (default) = ONE route per API at /<context>/<version> (strip_path=true),
      # all operations collapsed. PER_RESOURCE = one Kong route per WSO2 operation (verb+target), with
      # strip_path=false + a request-transformer replace.uri forwarding only the resource. Opt-in only.
      route-granularity: ${DECK_ROUTE_GRANULARITY:PER_RESOURCE}
      # When false (default) the generated files carry NO entity ids, so `deck gateway apply`
      # matches existing Konnect entities by their unique name and UPDATES them (adopting the
      # real id) instead of erroring with "entity already exists" when a same-named entity has a
      # different id. Turn on only for a greenfield CP that used these generated ids from day one.
      emit-entity-ids: ${DECK_EMIT_ENTITY_IDS:false}
      env-name: ${DECK_ENV:dev}
      pipeline-template-ref: ${DECK_PIPELINE_TEMPLATE_REF:migrationtestdeck/pipeline-template-poc/.github/workflows/kong.yaml@main}
      deck-mode: ${DECK_MODE:apply}
      konnect-addr: ${DECK_KONNECT_ADDR:https://us.api.konghq.com}
      kong-config-path-template: ${DECK_KONG_CONFIG_PATH:kong/{env}/kong.yaml}
      kong-config-dir-template: ${DECK_KONG_CONFIG_DIR:kong/{env}}
      # When true, a single-API migration writes to kong/<env>/<api>/ and the pipeline applies ONLY
      # that subdir — so migrating one API can't be blocked by an unrelated API's leftover file.
      # Multi-API migrations keep the flat kong/<env>/ layout. Set false to force flat for everything.
      per-api-dir: ${DECK_PER_API_DIR:true}
      # Multi-API (flat kong/<env>/) runs also remove stale migrator-generated *.yaml left at the env
      # root by an earlier run/layout, which would otherwise duplicate an entity and fail decK
      # validate ("entity already exists"). Only non-current, non-create-only YAML is removed.
      reconcile-env-root: ${DECK_RECONCILE_ENV_ROOT:true}
      # When the env-root reconcile runs, also descend into per-API subdirs (kong/<env>/<slug>/) so
      # leftovers from an EARLIER single-API migration are cleared too — `deck apply` reads kong/<env>
      # recursively, so an old kong/<env>/<old-api>/*.yaml would otherwise re-create an API you removed
      # from the control plane. A multi-API run is then authoritative for the whole env tree; use a
      # single-API (per-api-dir) migration for true incremental changes.
      reconcile-recursive: ${DECK_RECONCILE_RECURSIVE:true}
      konnect-secret-name: ${DECK_KONNECT_SECRET_NAME:KONNECT_TOKEN}
      # TEST-ONLY: when true, the service sets a PLAINTEXT Actions variable named
      # {konnect-secret-name} on the repo (no libsodium needed) and the generated workflow
      # reads it via ${{ vars.NAME }}. INSECURE — use a real encrypted secret in prod.
      konnect-token-via-variable: ${DECK_KONNECT_TOKEN_VIA_VARIABLE:true}
      control-plane-name-fallback: ${DECK_CONTROL_PLANE_NAME:}
      bundle-dir: ${DECK_BUNDLE_DIR:${java.io.tmpdir}/kong-bundles}
      download-base-url: ${DECK_DOWNLOAD_BASE_URL:https://probestack.io/wso2/migration/v1}
      # Public base URL of this service; when set, the generated workflow POSTs the apply
      # report + dump back to {callback-base-url}/migrations/{id}/deck-result automatically.
      # This is what makes the job advance from DEPLOYING_TO_KONG → COMPLETED/FAILED, so it now
      # defaults to the public staging URL (override per-env with DECK_CALLBACK_BASE_URL).
      callback-base-url: ${DECK_CALLBACK_BASE_URL:${DECK_DOWNLOAD_BASE_URL:https://probestack.io/wso2/migration/v1}}
      # No pipeline callback (deck-result OR per-leg migration-status — each leg's report
      # refreshes the job heartbeat) within this many minutes → the job is marked TIMED_OUT.
      # Matrix runs execute one GitHub Actions job PER decK file sequentially, so this must
      # comfortably exceed one leg's worst-case duration (runner queue + checkout + deck apply).
      apply-timeout-minutes: ${DECK_APPLY_TIMEOUT_MINUTES:10}
      storage: ${DECK_STORAGE:temp}
      # Auto-commit the generated files to the Kong-config repo (else just produce the bundle).
      # repo/branch/token come from the kong_konnect_profiles row when present, else from here.
      git:
        # ON by default: a migration commits the kong files + workflow to the Kong-config
        # repo, which triggers the deck pipeline. Still needs repo + token below (or a
        # git_profiles row / kong_konnect_profiles git fields); self-skips with a WARN if absent.
        enabled: ${DECK_GIT_ENABLED:true}
        api-base-url: ${DECK_GIT_API_BASE_URL:https://api.github.com}
        repo: ${DECK_GIT_REPO:}
        branch: ${DECK_GIT_BRANCH:main}
        token: ${DECK_GIT_TOKEN:}
        profiles-collection: ${DECK_GIT_PROFILES_COLLECTION:git_profiles}
        author-name: ${DECK_GIT_AUTHOR_NAME:forgeshift-wso2-migrator}
        author-email: ${DECK_GIT_AUTHOR_EMAIL:migrator@forgeshift.local}
        commit-message-template: ${DECK_GIT_COMMIT_MSG:[wso2-migration] job {jobId} ({company}/{tenant})}
        # Reconcile stale, no-longer-generated files by MOVING them under archive-dir (kept for
        # audit/rollback) instead of deleting. They leave the deck apply path either way, so an API
        # removed from the control plane is not re-created on the next run. archive-dir MUST be outside
        # the kong/<env> path the pipeline applies (default 'archive' at the repo root).
        archive-stale: ${DECK_GIT_ARCHIVE_STALE:true}
        archive-dir: ${DECK_GIT_ARCHIVE_DIR:archive}
