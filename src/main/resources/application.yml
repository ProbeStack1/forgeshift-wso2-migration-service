spring:
  application:
    name: forgeshift-wso2-migration-service
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://java-app:LszhHwotDeKBfG3a@probestack-nonprod.hdggqx.mongodb.net/probestack-wso2-forgeshift?appName=Probestack-nonprod}
      database: ${MONGODB_DATABASE:probestack-wso2-forgeshift}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /wso2/migration/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.forgeshift: INFO
    org.springframework.web: INFO
    org.mongodb.driver: WARN

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
  temperature: ${ANTHROPIC_TEMPERATURE:0.0}
  connect-timeout-ms: ${ANTHROPIC_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${ANTHROPIC_READ_TIMEOUT_MS:60000}
  min-confidence: ${ANTHROPIC_MIN_CONFIDENCE:0.7}
  max-lua-bytes: ${ANTHROPIC_MAX_LUA_BYTES:51200}

gcs:
  # Reads the assessment-staged API JSON as a 3rd reconcile source (lowest precedence).
  # Mirrors the assessment service's gcs block; SA key mounted into credentials/ at runtime.
  enabled: ${GCS_ENABLED:true}
  credentials:
    location: ${GCS_CREDENTIALS_LOCATION:file:credentials/firestore-credentials.json}
  project-id: ${GCS_PROJECT_ID:your-project-id}
  default-bucket-name: ${GCS_DEFAULT_BUCKET_NAME:run-sources-probestack-e2068-us-central1}
  migration-bucket-name: ${GCS_MIGRATION_BUCKET_NAME:run-sources-probestack-e2068-us-central1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

forgeshift:
  migration:
    # Collections written by THIS service
    jobs-collection: migration_jobs
    entity-mappings-collection: entity_mappings
    reports-collection: migration_reports
    audit-collection: migration_audit_info

    # Collections READ from discovery service
    discovery-collection-prefix: discovery_wso2_
    discovery-revisions-collection: discovery_revisions

    # Collections READ from profile-config service
    wso2-profiles-collection: wso2_profiles
    kong-konnect-profiles-collection: kong_konnect_profiles

    # Translation defaults
    translation:
      default-throttle-rpm: ${TRANSLATION_DEFAULT_THROTTLE_RPM:10000}
      default-timeout-ms: ${TRANSLATION_DEFAULT_TIMEOUT_MS:60000}
      tag-prefix: wso2-source-id
      migrated-by-tag: migrated-by:forgeshift-wso2-migrator
      # Throttling tier name → requests per minute. Mirrors the Archive Python script.
      throttling-tier-map:
        Bronze: 10
        Silver: 50
        Gold: 200
        Platinum: 500
        Unlimited: 10000

    # Konnect API tuning
    konnect:
      base-url-fallback: ${KONNECT_BASE_URL:https://us.api.konghq.com}
      access-token-fallback: ${KONNECT_ACCESS_TOKEN:kpat_2d2rITsYZEege6CyD989DcS6nLTGDiRe3U2VSZZBfEzAQ7VvR}
      control-plane-id-fallback: ${KONNECT_CONTROL_PLANE_ID:43dbc26e-23c1-4443-982a-96321e6d0dfb}
      request-timeout-seconds: 30
      trust-self-signed: ${KONNECT_TRUST_SELF_SIGNED:false}
      # Path templates under {base-url}/v2/control-planes/{cp-id}/core-entities/...
      services-path: /services
      routes-path: /routes
      upstreams-path: /upstreams
      targets-path: /upstreams/{upstreamId}/targets
      consumers-path: /consumers
      plugins-path: /plugins

    tenant:
      header-name: ${TENANT_HEADER:X-Partner-Id}
      default-tenant: ${DEFAULT_TENANT:probestack}

    # WSO2 source-side tuning for the bundle download phase. The actual
    # baseUrl / admin creds / DCR client are resolved per request from
    # the wso2_profiles collection.
    wso2:
      publisher-scope: ${WSO2_PUBLISHER_SCOPE:apim:api_view apim:api_create apim:api_publish apim:api_import_export}
      token-path: ${WSO2_TOKEN_PATH:/oauth2/token}
      # APIM 4.x export endpoint — query-string form. The client appends
      # ?apiId=...&format=...&preserveStatus=... at call time.
      export-path: ${WSO2_EXPORT_PATH:/api/am/publisher/v4/apis/export}
      export-format: ${WSO2_EXPORT_FORMAT:JSON}
      preserve-status: ${WSO2_PRESERVE_STATUS:true}
      timeout-seconds: ${WSO2_TIMEOUT_SECONDS:60}

    bundle-download:
      temp-dir: ${BUNDLE_TEMP_DIR:${java.io.tmpdir}/wso2-migration-bundles}
      cleanup-after-migration: ${BUNDLE_CLEANUP:true}
